apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: macro-mate
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/gattma/macro-mate-ci.git'
    targetRevision: kustomize
    path: overlays/prod
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: macro-mate
  syncPolicy:
    automated:
      prune: true
      selfHeal: true